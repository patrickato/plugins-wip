# MoreUptimeNG - add this block to /etc/pwnagotchi/config.toml
#
# This fork's plugin loader does NOT read a plugin's __defaults__ - every
# option below must be set here explicitly.

[main.plugins.more_uptime_ng]
enabled = true

# If true, hijacks the stock "uptime" UI element's label/value instead of
# creating a separate element. If false (default), adds its own
# "more_uptime_ng" element.
override = false

# >>> USER INPUT REQUIRED (optional) <<<
# Screen position of the element, only used when override is false.
# Leave both commented out (or absent) for the default,
# top-right-ish corner (ui.width() - 58, 12).
# position_x = 10
# position_y = 12

# >>> USER INPUT REQUIRED (optional) <<<
# How many seconds each state is shown before cycling to the next one.
# Default is 5. Invalid values (zero, negative, non-numeric) fall back
# to the default rather than crashing or spinning.
# cycle_interval = 5

# >>> USER INPUT REQUIRED (optional) <<<
# Which states to cycle through, and in what order. Valid entries are
# "IN" (time since this plugin loaded), "PR" (pwnagotchi process
# uptime), "UP" (system uptime). Any subset/order is valid - list just
# one to stop cycling entirely. Default is all three, in this order.
# An empty list, or a list with no valid entries, falls back to the
# default.
# states = ["IN", "PR", "UP"]
