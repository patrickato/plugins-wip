# TweakViewNG - add this block to /etc/pwnagotchi/config.toml
#
# This fork's plugin loader does NOT read a plugin's __defaults__ - every
# option below must be set here explicitly.
#
# STILL NO GUARDRAILS ON WHAT YOU CHANGE - this plugin lets you rewrite
# the position/font/label of any real UI element live, via a webhook
# page. Fixed vs. the original: tweaks now load before the UI is first
# built (so they apply immediately instead of one refresh late), a
# malformed saved entry is skipped with a specific warning instead of
# silently corrupting the file or crashing, and two real bugs in the
# webhook page itself (a swallowed JSON-preview crash, and an
# undefined-variable bug that masked "couldn't save" errors) are fixed.

[main.plugins.tweak_view_ng]
enabled = true

# Where saved tweaks are stored. Safe to leave as the default - this is
# managed entirely by the webhook page below, you never need to hand-edit
# this file (though you can).
filename = "/etc/pwnagotchi/tweak_view_ng.json"
