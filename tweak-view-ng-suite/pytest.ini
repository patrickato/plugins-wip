[pytest]
# The offline unit suite (tests/) and the real-framework integration suite
# (tests/integration/) use mutually exclusive conftests - one installs
# framework stubs, the other evicts them and loads the real Jayofelony code.
# They are therefore run as separate invocations and must not be collected in
# the same process (both define a top-level `conftest` module).
#
# A bare `pytest` runs the unit suite. Run the integration suite explicitly:
#     python3 -m pytest tests/integration
# (optionally with PWNAGOTCHI_SRC=/path/to/pwnagotchi).
testpaths = tests
addopts = --ignore=tests/integration
