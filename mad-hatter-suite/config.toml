# MadHatterNG - add this block to /etc/pwnagotchi/config.toml
#
# This fork's plugin loader does NOT read a plugin's __defaults__ - every
# option below must be set here explicitly (MadHatterNG.py works around
# this itself by merging __defaults__ in on_loaded, but the shipped block
# below still spells everything out so it's all visible/editable in one
# place, matching this repo's convention).
#
# IMPORTANT - the section name below is [main.plugins.MadHatterNG], with
# a capital NG, matching the plugin FILE's exact basename (MadHatterNG.py).
# This is not a style choice: this fork's loader
# (pwnagotchi/plugins/__init__.py) registers and looks up every plugin -
# both whether it's "enabled" at all, and its options table - by the
# plugin file's basename, verbatim, case included. A section spelled
# mad_hatter_ng (snake_case) for a file named MadHatterNG.py would never
# even show up in the framework's "enabled" list, so the plugin would
# silently never load - not an options bug, a total no-load. See
# NOTES.md for the full verified writeup (including what to change here
# if you'd rather rename the file itself to mad_hatter_ng.py instead).

[main.plugins.MadHatterNG]
enabled = true

# ---------------------------------------------------------------------
# Hardware selection
# ---------------------------------------------------------------------

# >>> USER INPUT REQUIRED <<<
# Set to your actual hardware for a faster, more reliable startup than
# auto-detection (auto-detection still works and is what "auto" does -
# see the aliases below). This is shipped as "waveshare" because that's
# the confirmed hardware this plugin targets for this install (a
# Waveshare UPS 3S HAT, INA219-based). If you're on different hardware,
# change this - recognized values: "auto", "waveshare", "seengreat",
# "sbcomponents", "ep-0136", "ina219" (any generic INA219 HAT), "x1200"
# / "ups_lite" / "max17040" / "max17048" (MAX170xx fuel gauge boards),
# "pisugar2", "pisugar2pro", "pisugar3".
ups_type = "waveshare"

# I2C bus number and, only if you have more than one UPS-like chip on
# the bus, a specific address to force (-1 = auto-pick during detection).
i2c_bus = 1
i2c_address = -1

# ---------------------------------------------------------------------
# Battery / hardware tuning
# ---------------------------------------------------------------------

# >>> USER INPUT REQUIRED (optional, but worth confirming) <<<
# Your pack's rated capacity in mAh. Used for time-remaining estimates
# and charge-cycle counting. 2000 is a reasonable placeholder, not a
# measurement of your actual pack - check the label on your battery.
battery_mah = 2000

# Average discharge current (mA), used ONLY as the last-resort fallback
# for the time-remaining estimate when the backend has no current sensor
# and the drain-rate estimator hasn't gathered enough history yet.
avg_current_ma = 200

# Number of cells in series ("auto" infers this from resting pack
# voltage - 1S/2S/3S/4S - or set a fixed integer if you know it, e.g.
# the Waveshare UPS 3S HAT is 3).
battery_cells = "auto"

# SoC-estimation tuning (only used by chips with no fuel gauge, i.e. the
# INA219/PiSugar backends - MAX170xx has its own onboard SoC and ignores
# these). internal_resistance is ohms per cell, used to compensate the
# terminal voltage back towards open-circuit voltage under load.
internal_resistance = 0.12
soc_smoothing = 0.25

# INA219-only: your shunt resistor value in ohms. The Waveshare UPS 3S
# HAT uses a 0.1 ohm shunt (the default below) - check your board's
# schematic/silkscreen if you're not sure, since a wrong value scales
# every current/mA reading incorrectly.
shunt_ohms = 0.1

# Flip if current reads negative while charging / positive while
# discharging (some INA219 HATs wire the shunt the other way around).
invert_current = false

# Below this current magnitude (mA), charge/discharge state is
# considered noise and the previous state is kept (hysteresis).
charging_threshold_ma = 30

# ---------------------------------------------------------------------
# GPIO charge detection (optional - most boards don't need this)
# ---------------------------------------------------------------------

# BCM pin number for a hardware charge-status line, or -1 to disable
# (falls back to current-based or voltage-trend detection instead).
charging_gpio = -1
charging_gpio_active_high = true

# Extra BCM pins to treat as reserved/unsafe to claim, on top of the
# plugin's own built-in list (I2C/SPI/UART lines and known display-HAT
# pins). allow_unsafe_gpio bypasses ALL conflict checking - only use
# this if you're certain the pin is genuinely free on your build.
reserved_gpios = []
allow_unsafe_gpio = false

# MAX170xx only: SoC percentage at which the chip's own ALERT pin fires.
alert_threshold = 10

# ---------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------

show_voltage = false
show_time_estimate = true
show_icon = true
use_emoji = false
label = "UPS"

# Screen position. Negative ui_position_x means "this many pixels in
# from the right edge" (so -80 keeps it on-screen on both 128px and
# 250px-wide displays) - this exact convention is unchanged from the
# original mad_hatter.py.
ui_position_x = -80
ui_position_y = 0
ui_font = "medium"       # "small" | "medium" | "bold"

# ---------------------------------------------------------------------
# Shutdown
# ---------------------------------------------------------------------

# Off by default - the plugin only WATCHES and displays battery state
# until you opt in here.
shutdown_enabled = false
warning_threshold = 15      # log a warning below this SoC%
shutdown_threshold = 5      # begin the shutdown-grace countdown below this
critical_threshold = 2      # shut down IMMEDIATELY below this, no grace
shutdown_grace = 3          # consecutive low polls required before shutting down
shutdown_grace_period = 30  # ...and this many seconds must also have elapsed

# ---------------------------------------------------------------------
# NEW: threshold notifications (feature 1)
# ---------------------------------------------------------------------

# When true, a warning/critical/shutdown-imminent threshold crossing is
# also pushed through whichever notification suite is available, once
# per crossing (not every poll cycle). Off by default.
notify_on_threshold = false

# "apprise" | "discord" | "auto" (try apprise first, then discord).
# If the chosen/detected plugin isn't loaded or isn't configured, this
# is logged and skipped - it never crashes the poll loop. on_ready logs
# a clear INFO/WARNING line stating whether each sibling was actually
# found, so a misconfiguration shows up in the normal log right away.
notify_backend = "auto"

# Post-cluster-review addition: the plugin-loaded lookup names for the
# two notification suites above. Only change these if you've renamed
# apprise-notify-suite's or discord-suite's .py file from its shipped
# name - otherwise leave as-is.
apprise_plugin_name = "apprise_notify_ng"
discord_plugin_name = "discord_ng"

# ---------------------------------------------------------------------
# NEW: trend history logging (feature 2)
# ---------------------------------------------------------------------

# How many samples to keep (a bounded ring buffer - old points are
# dropped, this file can never grow without limit) and how often
# (seconds) to take one. 720 points x 60s = 12 hours of history.
history_max_points = 720
history_log_interval_seconds = 60
history_path = "/root/.mad_hatter_ng_history.json"

# ---------------------------------------------------------------------
# NEW: drain-rate / activity correlation (feature 3)
# ---------------------------------------------------------------------

# Optional, best-effort - read from timer-suite's per-handshake CSV if
# present (same default path timer_ng.py itself writes to). If this
# file doesn't exist, the /history page just shows "n/a" for the
# active/idle drain-rate split; nothing else is affected.
timer_csv_path = "/etc/pwnagotchi/timer_ng.csv"

# How many minutes around a logged handshake-timing event counts as
# "active" when splitting drain rate into active-vs-idle buckets.
activity_correlation_window_minutes = 5

# ---------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------

poll_interval = 10
debug_mode = false
